name: Deploy to Pages

# Stamps the version and published date into app.js, then publishes. The point is that
# what the site claims about itself is always what was actually deployed — no hand-edited
# version number, and no "updated" date that quietly refers to some earlier build.
#
# Nothing is committed back to the branch. The stamp happens on the checked-out copy on
# the way to the Pages artifact, so main stays clean and there is no push loop.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run should replace an older queued run, but never interrupt one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the version is the commit count, which a shallow clone gets wrong.
          fetch-depth: 0

      - name: Stamp version and published date
        run: |
          set -euo pipefail
          VERSION="1.$(git rev-list --count HEAD)"
          PUBLISHED="$(date -u '+%a %b %-d %Y')"

          # Fail loudly rather than publishing a page that lies about itself.
          grep -q "^    const RBA_VERSION   = 'dev';" app.js
          grep -q "^    const RBA_PUBLISHED = 'not yet published';" app.js

          sed -i "s|^    const RBA_VERSION   = 'dev';|    const RBA_VERSION   = '${VERSION}';|" app.js
          sed -i "s|^    const RBA_PUBLISHED = 'not yet published';|    const RBA_PUBLISHED = '${PUBLISHED}';|" app.js

          echo "Stamped v${VERSION}, published ${PUBLISHED}"
          grep -n "RBA_VERSION\|RBA_PUBLISHED" app.js | head -2

      - uses: actions/configure-pages@v6

      # The artifact name carries the attempt number, and deploy-pages is told to
      # fetch that exact name.
      #
      # WHY: artifacts persist per *run*, not per attempt. Hit "re-run" on a failed
      # run and attempt 2 uploads a second artifact alongside attempt 1's, both
      # called github-pages — then deploy-pages finds two, cannot tell which is
      # current, and fails the whole run with "Multiple artifacts named
      # github-pages were unexpectedly found". That is exactly how run
      # 32050396148 failed: the commit that added the logo library never published,
      # and the site sat on an older hand-triggered deploy until someone noticed.
      #
      # The failure mode is nasty because re-running is the obvious response to a
      # flake, and it is guaranteed to fail a second time — so a transient error
      # turns into a permanently stuck deploy that only a fresh commit clears.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
